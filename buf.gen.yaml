version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: packages/proto-go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: packages/proto-go
    opt:
      - paths=source_relative
  - remote: buf.build/bufbuild/es:v2.5.0
    out: packages/proto-es
    opt:
      - target=ts
inputs:
  - directory: proto
