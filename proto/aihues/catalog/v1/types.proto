syntax = "proto3";

package aihues.catalog.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aihues/aiushtha/gen/go/aihues/catalog/v1;catalogv1";

// 条目类型（多态目录表的行类型判别符；仅用于内部存储，不暴露在 Tool / Game 消息上）
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_TOOL = 1;
  ITEM_KIND_GAME = 2;
}

// 条目状态
enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_DRAFT = 1;
  ITEM_STATUS_PUBLISHED = 2;
  ITEM_STATUS_ARCHIVED = 3;
}

// 条目分类（tool / game 通用；目前枚举值仅覆盖 tool，未来 game 分类可在此扩展）
enum ItemCategory {
  ITEM_CATEGORY_UNSPECIFIED = 0;
  ITEM_CATEGORY_DEVELOPER = 1;
  ITEM_CATEGORY_UTILITY = 2;
  ITEM_CATEGORY_AI_WRITING = 3;
}

// 工具元数据
message Tool {
  string id          = 1;
  string slug        = 2;
  string icon        = 3;
  string name        = 4;
  string description = 5;
  ItemCategory category = 6;
  ItemStatus status  = 7;
  int32  sort_order  = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
}

// 游戏元数据
message Game {
  string id          = 1;
  string slug        = 2;
  string icon        = 3;
  string name        = 4;
  string description = 5;
  ItemStatus status  = 6;
  int32  sort_order  = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
}
