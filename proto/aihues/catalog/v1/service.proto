syntax = "proto3";

package aihues.catalog.v1;

import "aihues/catalog/v1/types.proto";

option go_package = "github.com/aihues/aiushtha/packages/proto-go/aihues/catalog/v1;catalogv1";

// 公开读服务
service CatalogService {
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);
  // 语义搜索（全站工具/游戏/测试），由 FAISS + 句向量驱动
  rpc SearchCatalog(SearchCatalogRequest) returns (SearchCatalogResponse);
  // 相关推荐（按 slug 或自由文本，限定同类型）
  rpc RelatedItems(RelatedItemsRequest) returns (RelatedItemsResponse);
}

// 语义命中
message SearchHit {
  string slug = 1;
  string title = 2;
  string subtitle = 3;
  string href = 4;
  string type = 5; // tool | game | test
  float score = 6;
}

message SearchCatalogRequest {
  string q = 1; // 查询词
  int32 k = 2;  // 取前 k 条，默认 8
}

message SearchCatalogResponse {
  repeated SearchHit hits = 1;
}

// 相关条目
message RelatedItem {
  string slug = 1;
  string title = 2;
  string desc = 3;
  string subtitle = 4;
  string href = 5;
  string type = 6; // tool | game | test
}

message RelatedItemsRequest {
  string type = 1; // tool | game | test
  string slug = 2; // 按条目 slug 找相邻（与 q 二选一）
  string q = 3;    // 按自由文本找相邻
  int32 k = 4;     // 取前 k 条，默认 6
}

message RelatedItemsResponse {
  repeated RelatedItem items = 1;
}

message ListToolsRequest {
  string q = 1; // optional keyword（匹配 name/description）
  // 每页数据量；默认 10，最大 20
  int32 page_size = 2;
  // 分页 token；第一页不传，后续传上一页返回的 next_page_token
  string page_token = 3;
  // 不传或 ITEM_CATEGORY_UNSPECIFIED 表示不过滤
  ItemCategory category = 4;
}

message ListToolsResponse {
  repeated Tool tools = 1;
  string next_page_token = 2;
}

message ListGamesRequest {
  // 每页数据量；默认 10，最大 20
  int32 page_size = 1;
  // 分页 token；第一页不传，后续传上一页返回的 next_page_token
  string page_token = 2;
}

message ListGamesResponse {
  repeated Game games = 1;
  string next_page_token = 2;
}
