# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'
type: application
language: typescript
platform: node
tags:
  - docker

extends: 'tag-docker'

dependsOn:
  - shared-types

tasks:
  dev:
    command: pnpm run dev
    local: true

  build:
    command: pnpm run build
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
    outputs:
      - 'dist'

  start:
    command: pnpm run start
    deps:
      - build
    local: true

  typecheck:
    command: pnpm run check
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
