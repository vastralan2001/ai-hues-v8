# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'
type: application
language: typescript
platform: node

dependsOn:
  - shared-types

tasks:
  dev:
    command: pnpm run dev
    local: true

  build:
    command: pnpm run build
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
    outputs:
      - 'dist'

  start:
    command: pnpm run start
    deps:
      - build
    local: true

  container:
    script: |
      docker build -f Dockerfile --push -t ${CI_REGISTRY:+$CI_REGISTRY/}papers-api:${CI_COMMIT_SHORT_SHA:0:7} .
    deps:
      - build
    inputs:
      - 'Dockerfile'
      - 'package.json'
      - 'src/**/*'
    options:
      runInCI: true
