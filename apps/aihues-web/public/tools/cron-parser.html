<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Expression Parser / Cron </title>
<style>
/* ── CSS Variables ── */
  :root {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #0f172a;
    --border: #334155;
    --border-focus: #60a5fa;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --accent: #38bdf8;
    --accent-soft: rgba(56,189,248,0.15);
    --success: #4ade80;
    --success-soft: rgba(74,222,128,0.12);
    --error: #f87171;
    --error-soft: rgba(248,113,113,0.12);
    --warning: #fbbf24;
    --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -2px rgba(0,0,0,0.2);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header p {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  /* ── Cards ── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon {
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 1.1rem;
  }

  /* ── Cron Input Row ── */
  .cron-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .field-group {
    flex: 1;
    min-width: 120px;
  }
  .field-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .field-group input {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg-input);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    font-size: 1rem;
    text-align: center;
    transition: all 0.2s ease;
    outline: none;
  }
  .field-group input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
  }
  .field-group input.error {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(248,113,113,0.15);
  }
  .field-group .hint {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 4px;
    text-align: center;
  }
  .field-group .err-msg {
    font-size: 0.7rem;
    color: var(--error);
    margin-top: 4px;
    text-align: center;
    display: none;
  }
  .field-group input.error ~ .err-msg {
    display: block;
  }

  /* ── Full Expression Display ── */
  .expr-display {
    margin-top: 20px;
    padding: 16px 20px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .expr-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .expr-code {
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    font-size: 1.2rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .expr-actions {
    display: flex;
    gap: 8px;
  }
  .btn-sm {
    padding: 6px 14px;
    font-size: 0.8rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font);
    font-weight: 500;
  }
  .btn-sm:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .btn-sm.copied {
    border-color: var(--success);
    color: var(--success);
    background: var(--success-soft);
  }

  /* ── Presets ── */
  .presets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .preset-btn {
    padding: 10px 14px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .preset-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }
  .preset-btn:active {
    transform: translateY(0);
  }
  .preset-btn .preset-name {
    font-weight: 600;
    display: block;
    margin-bottom: 2px;
  }
  .preset-btn .preset-zh {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .preset-btn .preset-expr {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: monospace;
    margin-top: 2px;
  }

  /* ── Description ── */
  .desc-box {
    padding: 24px;
    background: linear-gradient(135deg, rgba(56,189,248,0.08), rgba(129,140,248,0.08));
    border: 1px solid rgba(56,189,248,0.25);
    border-radius: var(--radius);
    text-align: center;
  }
  .desc-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .desc-text {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    word-break: break-word;
  }
  .desc-eng {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-top: 8px;
    font-style: italic;
  }

  /* ── Next Executions ── */
  .exec-list {
    list-style: none;
  }
  .exec-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    transition: all 0.2s ease;
  }
  .exec-item:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .exec-item:last-child { margin-bottom: 0; }
  .exec-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .exec-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .exec-datetime {
    font-family: 'SF Mono', monospace;
    font-size: 0.95rem;
    color: var(--text);
    font-weight: 600;
  }
  .exec-weekday {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-left: 4px;
  }
  .exec-countdown {
    font-size: 0.8rem;
    color: var(--text-dim);
    font-style: italic;
  }
  .exec-countdown.soon {
    color: var(--success);
    font-weight: 600;
  }

  /* ── Countdown Highlight ── */
  .countdown-box {
    margin-top: 16px;
    padding: 16px;
    background: var(--success-soft);
    border: 1px solid rgba(74,222,128,0.3);
    border-radius: var(--radius-sm);
    text-align: center;
  }
  .countdown-label {
    font-size: 0.8rem;
    color: var(--success);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .countdown-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--success);
  }

  /* ── Legend / Help ── */
  .legend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .legend-item {
    font-size: 0.82rem;
    color: var(--text-muted);
    padding: 8px 10px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .legend-item code {
    color: var(--accent);
    font-family: 'SF Mono', monospace;
    font-size: 0.85rem;
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 6px;
  }

  /* ── Status Badge ── */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 12px;
  }
  .status-badge.valid {
    background: var(--success-soft);
    color: var(--success);
    border: 1px solid rgba(74,222,128,0.3);
  }
  .status-badge.invalid {
    background: var(--error-soft);
    color: var(--error);
    border: 1px solid rgba(248,113,113,0.3);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .cron-row { flex-direction: column; }
    .field-group { min-width: 100%; }
    .presets-grid { grid-template-columns: 1fr 1fr; }
    .desc-text { font-size: 1.25rem; }
    .header h1 { font-size: 1.4rem; }
    .card { padding: 18px; }
    .expr-display { flex-direction: column; align-items: stretch; text-align: center; }
    .expr-actions { justify-content: center; }
    .exec-item { flex-direction: column; align-items: flex-start; gap: 6px; }
    .exec-countdown { margin-left: 40px; }
  }

  /* ── Animations ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeIn 0.4s ease both; }
  .card:nth-child(2) { animation-delay: 0.05s; }
  .card:nth-child(3) { animation-delay: 0.1s; }
  .card:nth-child(4) { animation-delay: 0.15s; }
  .card:nth-child(5) { animation-delay: 0.2s; }

  /* ── Sparkle on preset click ── */
  @keyframes sparkle {
    0% { box-shadow: 0 0 0 0 rgba(56,189,248,0.4); }
    100% { box-shadow: 0 0 0 12px rgba(56,189,248,0); }
  }
  .preset-btn.sparkle {
    animation: sparkle 0.5s ease;
  }

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>Cron Expression Parser</h1>
    <p> Cron ， 5 ，</p>
  </div>

  <!-- Cron Input Card -->
  <div class="card">
    <div class="card-title">
      <span class="icon">&#9881;</span>
      Cron 
    </div>
    <div class="cron-row">
      <div class="field-group">
        <label for="field-min"></label>
        <input type="text" id="field-min" value="0" placeholder="*" autocomplete="off" oninput="onFieldInput()">
        <div class="hint">0-59</div>
        <div class="err-msg" id="err-min"></div>
      </div>
      <div class="field-group">
        <label for="field-hour"></label>
        <input type="text" id="field-hour" value="9" placeholder="*" autocomplete="off" oninput="onFieldInput()">
        <div class="hint">0-23</div>
        <div class="err-msg" id="err-hour"></div>
      </div>
      <div class="field-group">
        <label for="field-day"></label>
        <input type="text" id="field-day" value="*" placeholder="*" autocomplete="off" oninput="onFieldInput()">
        <div class="hint">1-31</div>
        <div class="err-msg" id="err-day"></div>
      </div>
      <div class="field-group">
        <label for="field-month"></label>
        <input type="text" id="field-month" value="*" placeholder="*" autocomplete="off" oninput="onFieldInput()">
        <div class="hint">1-12</div>
        <div class="err-msg" id="err-month"></div>
      </div>
      <div class="field-group">
        <label for="field-weekday"></label>
        <input type="text" id="field-weekday" value="1" placeholder="*" autocomplete="off" oninput="onFieldInput()">
        <div class="hint">0-7 (0,7=)</div>
        <div class="err-msg" id="err-weekday"></div>
      </div>
    </div>

    <div class="expr-display">
      <div>
        <span class="expr-label"></span>
        <div style="margin-top:4px">
          <code class="expr-code" id="expr-code">0 9 * * 1</code>
        </div>
      </div>
      <div class="expr-actions">
        <button class="btn-sm" id="copy-btn" onclick="copyExpr()">📋 </button>
        <button class="btn-sm" onclick="pasteExpr()">📥 </button>
      </div>
    </div>

    <div style="margin-top:12px" id="status-area"></div>
  </div>

  <!-- Presets Card -->
  <div class="card">
    <div class="card-title">
      <span class="icon">⚡</span>
      
    </div>
    <div class="presets-grid" id="presets-grid"></div>
  </div>

  <!-- Description Card -->
  <div class="card">
    <div class="card-title">
      <span class="icon">📝</span>
      
    </div>
    <div class="desc-box">
      <div class="desc-label"></div>
      <div class="desc-text" id="desc-text"> 9:00</div>
      <div class="desc-eng" id="desc-eng">Every Monday at 9:00 AM</div>
    </div>

  <!-- Next Executions Card -->
  <div class="card">
    <div class="card-title">
      <span class="icon">⏰</span>
      
    </div>
    <ul class="exec-list" id="exec-list"></ul>

  <div class="card">

<script>// ═══════════════════════════════════════
//  Data
// ═══════════════════════════════════════
const presets = [
  {name:'Every minute', zh:'', expr:'* * * * *'},
  {name:'Every 5 minutes', zh:'5', expr:'*/5 * * * *'},
  {name:'Every 15 minutes', zh:'15', expr:'*/15 * * * *'},
  {name:'Every hour', zh:'', expr:'0 * * * *'},
  {name:'Every 2 hours', zh:'2', expr:'0 */2 * * *'},
  {name:'Every day at midnight', zh:'', expr:'0 0 * * *'},
  {name:'Every day at 9am', zh:'9', expr:'0 9 * * *'},
  {name:'Every Monday at 9am', zh:'9', expr:'0 9 * * 1'},
  {name:'Every weekday at 9am', zh:'9', expr:'0 9 * * 1-5'},
  {name:'1st of month at midnight', zh:'1', expr:'0 0 1 * *'},
  {name:'Every Sunday at midnight', zh:'', expr:'0 0 * * 0'},
  {name:'Twice daily', zh:'', expr:'0 9,18 * * *'},
];

const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const weekdaysZh = ['','','','','','','',''];
const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const fieldsMeta = {
  min:     { min:0, max:59 },
  hour:    { min:0, max:23 },
  day:     { min:1, max:31 },
  month:   { min:1, max:12 },
  weekday: { min:0, max:7 },
};

// ═══════════════════════════════════════
//  Init
// ═══════════════════════════════════════
function init() {
  renderPresets();
  updateAll();
  setInterval(updateCountdown, 1000);
}

function renderPresets() {
  const grid = document.getElementById('presets-grid');
  grid.innerHTML = presets.map((p, i) => `
    <button class="preset-btn" onclick="applyPreset(${i}, this)">
      <span class="preset-name">${p.name}</span>
      <span class="preset-zh">${p.zh}</span>
      <span class="preset-expr">${p.expr}</span>
    </button>
  `).join('');
}

// ═══════════════════════════════════════
//  Field Input Handling
// ═══════════════════════════════════════
function onFieldInput() {
  updateAll();
}

function getExpr() {
  const parts = ['min','hour','day','month','weekday'].map(f =>
    document.getElementById('field-'+f).value.trim() || '*'
  );
  return parts.join(' ');
}

function updateExprDisplay() {
  document.getElementById('expr-code').textContent = getExpr();
}

function updateAll() {
  updateExprDisplay();
  validateAll();
  const expr = getExpr();
  const valid = isValid(expr);
  updateStatus(valid);
  if (valid) {
    document.getElementById('desc-text').textContent = describeCronZh(expr);
    document.getElementById('desc-eng').textContent = describeCronEn(expr);
    renderExecutions(expr);
    updateCountdown();
  } else {
    document.getElementById('desc-text').textContent = 'Invalid expression';
    document.getElementById('desc-eng').textContent = '';
    document.getElementById('exec-list').innerHTML = '';
    document.getElementById('countdown-value').textContent = '--';
  }
}

// ═══════════════════════════════════════
//  Validation
// ═══════════════════════════════════════
function validateAll() {
  const parts = ['min','hour','day','month','weekday'];
  const names = ['min','hour','day','month','weekday'];
  let allValid = true;

  parts.forEach((field, i) => {
    const input = document.getElementById('field-'+field);
    const err = document.getElementById('err-'+field);
    const meta = fieldsMeta[field];
    const val = input.value.trim();

    if (!val) {
      input.classList.remove('error');
      return;
    }

    const valid = validateFieldValue(val, meta.min, meta.max);
    if (!valid) {
      input.classList.add('error');
      allValid = false;
    } else {
      input.classList.remove('error');
    }
  });

  return allValid;
}

function validateFieldValue(expr, fmin, fmax) {
  if (expr === '*') return true;
  if (expr === '') return false;

  // step syntax: */5 or 1-10/2
  if (expr.includes('/')) {
    const [base, step] = expr.split('/');
    const stepNum = parseInt(step);
    if (!stepNum || stepNum < 1) return false;
    if (base === '*') return true;
    if (base.includes('-')) {
      const [s, e] = base.split('-').map(Number);
      return s >= fmin && e <= fmax && s <= e;
    }
    const baseNum = parseInt(base);
    return baseNum >= fmin && baseNum <= fmax;
  }

  // list syntax: 1,2,3
  if (expr.includes(',')) {
    return expr.split(',').every(v => {
      const n = parseInt(v.trim());
      return n >= fmin && n <= fmax;
    });
  }

  // range syntax: 1-5
  if (expr.includes('-')) {
    const [s, e] = expr.split('-').map(Number);
    return s >= fmin && e <= fmax && s <= e;
  }

  // single value
  const n = parseInt(expr);
  return n >= fmin && n <= fmax;
}

function isValid(expr) {
  const parts = expr.split(' ');
  if (parts.length !== 5) return false;
  const names = ['min','hour','day','month','weekday'];
  return parts.every((p, i) => validateFieldValue(p, fieldsMeta[names[i]].min, fieldsMeta[names[i]].max));
}

function updateStatus(valid) {
  const area = document.getElementById('status-area');
  if (valid) {
    area.innerHTML = '<span class="status-badge valid"><span class="status-dot"></span></span>';
  } else {
    area.innerHTML = '<span class="status-badge invalid"><span class="status-dot"></span></span>';
  }
}

// ═══════════════════════════════════════
//  Cron Matching Engine
// ═══════════════════════════════════════
function matchField(value, expr, fmin, fmax) {
  if (expr === '*') return true;

  // step
  if (expr.includes('/')) {
    let [base, step] = expr.split('/');
    const stepNum = parseInt(step);
    if (base === '*') {
      return (value - fmin) % stepNum === 0;
    }
    if (base.includes('-')) {
      const [s, e] = base.split('-').map(Number);
      if (value < s || value > e) return false;
      return (value - s) % stepNum === 0;
    }
    const baseNum = parseInt(base);
    if (value < baseNum) return false;
    return (value - baseNum) % stepNum === 0;
  }

  // list
  if (expr.includes(',')) {
    return expr.split(',').some(v => parseInt(v.trim()) === value);
  }

  // range
  if (expr.includes('-')) {
    const [s, e] = expr.split('-').map(Number);
    return value >= s && value <= e;
  }

  // single
  return parseInt(expr) === value;
}

function matchesCron(date, min, hour, day, month, weekday) {
  // weekday: JS getDay() 0=Sunday, cron 0,7=Sunday
  let wd = date.getDay();
  // cron weekday 7 should be treated as 0
  const weekdayExpr = weekday === '7' ? '0' : weekday;

  return matchField(date.getMinutes(), min, 0, 59) &&
         matchField(date.getHours(), hour, 0, 23) &&
         matchField(date.getDate(), day, 1, 31) &&
         matchField(date.getMonth() + 1, month, 1, 12) &&
         matchField(wd, weekdayExpr, 0, 7);
}

// ═══════════════════════════════════════
//  Next Executions
// ═══════════════════════════════════════
function getNextExecutions(expr, count) {
  const [min, hour, day, month, weekday] = expr.split(' ');
  const results = [];
  let now = new Date();

  // Start from next minute
  now.setMinutes(now.getMinutes() + 1);
  now.setSeconds(0);
  now.setMilliseconds(0);

  // Safety: check up to 2 years ahead
  const maxDate = new Date(Date.now() + 2 * 365 * 86400000);

  while (results.length < count && now <= maxDate) {
    if (matchesCron(now, min, hour, day, month, weekday)) {
      results.push(new Date(now));
    }
    now.setMinutes(now.getMinutes() + 1);
  }

  return results;
}

function renderExecutions(expr) {
  const list = document.getElementById('exec-list');
  const execs = getNextExecutions(expr, 5);

  if (execs.length === 0) {
    list.innerHTML = '<li class="exec-item"><span> upcoming executions (2)</span></li>';
    return;
  }

  list.innerHTML = execs.map((d, i) => {
    const pad = n => String(n).padStart(2, '0');
    const str = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
    const isFirst = i === 0;
    const countdown = isFirst ? formatTimeDiff(d - new Date()) : '';
    return `
      <li class="exec-item">
        <div class="exec-left">
          <span class="exec-num">${i+1}</span>
          <span class="exec-datetime">${str}</span>
          <span class="exec-weekday">(${weekdaysZh[d.getDay()]})</span>
        </div>
        ${isFirst ? `<span class="exec-countdown soon">${countdown}</span>` : `<span class="exec-countdown">${weekdays[d.getDay()]}</span>`}
      </li>
    `;
  }).join('');

  window._nextExec = execs[0] || null;
}

function formatTimeDiff(ms) {
  if (ms <= 0) return '';
  const s = Math.floor(ms / 1000) % 60;
  const m = Math.floor(ms / 60000) % 60;
  const h = Math.floor(ms / 3600000) % 24;
  const d = Math.floor(ms / 86400000);
  if (d > 0) return `${d} ${h} ${m} ${s}`;
  if (h > 0) return `${h} ${m} ${s}`;
  if (m > 0) return `${m} ${s}`;
  return `${s}`;
}

function updateCountdown() {
  if (!window._nextExec) {
    document.getElementById('countdown-value').textContent = '--';
    return;
  }
  const diff = window._nextExec - new Date();
  document.getElementById('countdown-value').textContent = formatTimeDiff(diff);
}

// ═══════════════════════════════════════
//  Natural Language Description
// ═══════════════════════════════════════
function describeCronZh(expr) {
  const [min, hour, day, month, weekday] = expr.split(' ');
  const parts = [];

  // ── minute ──
  if (min === '*') {
    parts.push('');
  } else if (min.startsWith('*/')) {
    parts.push(`${min.split('/')[1]}`);
  } else if (min.includes(',')) {
    parts.push(`${min.split(',').map(Number).join('、')}`);
  } else if (min.includes('-')) {
    const [s, e] = min.split('-');
    parts.push(`${s}${e}`);
  } else {
    parts.push(`${min}`);
  }

  // ── hour ──
  if (hour === '*') {
    // every hour - already covered by minute phrasing
  } else if (hour.startsWith('*/')) {
    const step = hour.split('/')[1];
    if (min === '0') parts.push(`，${step}`);
    else parts.push(`，${step}${min}`);
  } else if (hour.includes(',')) {
    const hs = hour.split(',').map(Number);
    if (min === '0') parts.push(`，${hs.join('、')}`);
    else parts.push(`，${hs.map(h => `${h}${min}`).join('、')}`);
  } else if (hour.includes('-')) {
    const [s, e] = hour.split('-');
    if (min === '0') parts.push(`，${s}${e}`);
    else parts.push(`，${s}${e}${min}`);
  } else {
    if (min === '0') parts[parts.length-1] = `${hour}`;
    else parts.push(`，${hour}${min}`);
  }

  // ── day ──
  if (day !== '*') {
    if (day.includes(',')) parts.push(`，${day.split(',').map(Number).join('、')}`);
    else if (day.includes('-')) { const [s,e]=day.split('-'); parts.push(`，${s}${e}`); }
    else parts.push(`，${day}`);
  }

  // ── month ──
  if (month !== '*') {
    if (month.includes(',')) parts.push(`，${month.split(',').map(Number).join('、')}`);
    else if (month.includes('-')) { const [s,e]=month.split('-'); parts.push(`，${s}${e}`); }
    else parts.push(`，${month}`);
  }

  // ── weekday ──
  if (weekday !== '*') {
    if (weekday === '1-5') parts.push('，');
    else if (weekday === '0' || weekday === '7') parts.push('，');
    else if (weekday === '1') parts.push('，');
    else if (weekday === '2') parts.push('，');
    else if (weekday === '3') parts.push('，');
    else if (weekday === '4') parts.push('，');
    else if (weekday === '5') parts.push('，');
    else if (weekday === '6') parts.push('，');
    else if (weekday.includes(',')) {
      const wds = weekday.split(',').map(w => {
        const n = parseInt(w.trim());
        return weekdaysZh[n === 7 ? 0 : n];
      });
      parts.push(`，${wds.join('、')}`);
    } else if (weekday.includes('-')) {
      const [s, e] = weekday.split('-').map(Number);
      parts.push(`，${weekdaysZh[s]}${weekdaysZh[e]}`);
    }
  }

  let result = parts.join('');
  if (result.startsWith('，')) result = result.slice(1);

  // Special formatting
  if (min === '0' && hour === '0' && day === '*' && month === '*' && weekday === '*') result = '12:00';
  if (min === '0' && hour === '0' && day !== '*' && month === '*' && weekday === '*') result = `${day}12:00`;
  if (min === '0' && hour === '9' && day === '*' && month === '*' && weekday === '1') result = '9:00';
  if (min === '0' && hour === '9' && day === '*' && month === '*' && weekday === '1-5') result = '9:00';

  return result;
}

function describeCronEn(expr) {
  const [min, hour, day, month, weekday] = expr.split(' ');

  if (expr === '* * * * *') return 'Every minute';
  if (expr === '*/5 * * * *') return 'Every 5 minutes';
  if (expr === '*/15 * * * *') return 'Every 15 minutes';
  if (expr === '0 * * * *') return 'Every hour at minute 0';
  if (expr === '0 */2 * * *') return 'Every 2 hours';
  if (expr === '0 0 * * *') return 'Every day at midnight';
  if (expr === '0 9 * * *') return 'Every day at 9:00 AM';
  if (expr === '0 9 * * 1') return 'Every Monday at 9:00 AM';
  if (expr === '0 9 * * 1-5') return 'Every weekday at 9:00 AM';
  if (expr === '0 0 1 * *') return '1st of every month at midnight';
  if (expr === '0 0 * * 0') return 'Every Sunday at midnight';
  if (expr === '0 9,18 * * *') return 'Twice daily at 9:00 AM and 6:00 PM';

  // Generic fallback
  let desc = '';
  if (min === '0' && hour !== '*') desc = `At ${hour}:00`;
  else if (min.startsWith('*/')) desc = `Every ${min.split('/')[1]} minutes`;
  else desc = `At minute ${min}`;

  if (weekday === '1-5') desc += ' on weekdays';
  else if (weekday !== '*') desc += ` on ${weekdays[parseInt(weekday) % 7]}`;
  if (day !== '*') desc += ` on day ${day} of the month`;

  return desc;
}

// ═══════════════════════════════════════
//  Presets
// ═══════════════════════════════════════
function applyPreset(index, btn) {
  const p = presets[index];
  const parts = p.expr.split(' ');
  ['min','hour','day','month','weekday'].forEach((f, i) => {
    const input = document.getElementById('field-'+f);
    input.value = parts[i];
    input.classList.remove('error');
  });

  // Sparkle effect
  btn.classList.remove('sparkle');
  void btn.offsetWidth; // reflow
  btn.classList.add('sparkle');

  updateAll();
}

// ═══════════════════════════════════════
//  Copy & Paste
// ═══════════════════════════════════════
async function copyExpr() {
  const expr = getExpr();
  try {
    await navigator.clipboard.writeText(expr);
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ ';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 ';
      btn.classList.remove('copied');
    }, 2000);
  } catch (e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = expr;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

async function pasteExpr() {
  try {
    const text = await navigator.clipboard.readText();
    parseAndApplyFullExpr(text.trim());
  } catch (e) {
    alert('Unable to read clipboard. Please paste into any input manually.');
  }
}

function parseAndApplyFullExpr(text) {
  // Try to parse a 5-part cron expression
  const parts = text.split(/\s+/);
  if (parts.length === 5) {
    ['min','hour','day','month','weekday'].forEach((f, i) => {
      document.getElementById('field-'+f).value = parts[i];
    });
    updateAll();
  } else {
    // Maybe it's 6 or 7 parts (with seconds/year), try the middle 5
    if (parts.length >= 5) {
      const start = parts.length === 6 ? 1 : (parts.length >= 7 ? 1 : 0);
      ['min','hour','day','month','weekday'].forEach((f, i) => {
        document.getElementById('field-'+f).value = parts[start + i];
      });
      updateAll();
    }
  }
}

// Listen for paste events on all field inputs to detect full expression paste
document.querySelectorAll('.field-group input').forEach(input => {
  input.addEventListener('paste', (e) => {
    const pasted = e.clipboardData.getData('text');
    if (pasted.includes(' ') && pasted.trim().split(/\s+/).length >= 5) {
      e.preventDefault();
      parseAndApplyFullExpr(pasted.trim());
    }
  });
});

//  Run
// ═══════════════════════════════════════
init();
