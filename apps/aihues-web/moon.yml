# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'
type: application
language: html

# 纯静态站点，不复用 .moon/tasks/node.yml 里的 ts/lint/typecheck 任务

tasks:
  dev:
    command: 'pnpm dev'
    local: true
    options:
      persistent: true
      runFromWorkspaceRoot: false

  start:
    command: 'pnpm start'
    options:
      persistent: true
      runFromWorkspaceRoot: false

  build:
    command: 'pnpm build'
    options:
      runFromWorkspaceRoot: false
