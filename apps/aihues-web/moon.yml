# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'
type: application
language: typescript
platform: node
tags:
  - docker
  - nextjs

dependsOn:
  - id: 'proto-es'
    scope: 'production'

tasks:
  build:
    command:
      - pnpm
      - run
      - build
    inputs:
      - 'app/**/*'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
    outputs:
      - '.next'
    options:
      mergeArgs: replace

  typecheck:
    inputs:
      - 'app/**/*'
      - 'tsconfig.json'

  format-check:
    command:
      - 'prettier'
      - '--ignore-path'
      - '.prettierignore'
      - '--end-of-line'
      - 'auto'
      - '--check'
      - '.'
    inputs:
      - '.prettierignore'
    options:
      mergeArgs: 'replace'
    local: true

  format:
    command:
      - 'prettier'
      - '--ignore-path'
      - '.prettierignore'
      - '--end-of-line'
      - 'auto'
      - '--write'
      - '.'
    inputs:
      - '.prettierignore'
    options:
      mergeArgs: 'replace'
    local: true
