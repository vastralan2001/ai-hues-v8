# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'
type: application
language: typescript
platform: node
tags:
  - nextjs

dependsOn:
  - shared-types

tasks:
  container:
    script: |
      docker build -f Dockerfile --push -t ${CI_REGISTRY:+$CI_REGISTRY/}papers-web:${CI_COMMIT_SHORT_SHA:0:7} .
    deps:
      - build
    inputs:
      - 'Dockerfile'
      - 'package.json'
      - 'next.config.*'
      - 'public/**/*'
      - 'app/**/*'
      - 'components/**/*'
      - 'lib/**/*'
    options:
      runInCI: true
