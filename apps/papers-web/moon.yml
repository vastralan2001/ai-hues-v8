# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
$schema: 'https://moonrepo.dev/schemas/project.json'
type: application
language: typescript
platform: node
tags:
  - nextjs

dependsOn:
  - shared-types

tasks:
  container:
    script: |
      docker build -f apps/papers-web/Dockerfile --push -t ${CI_REGISTRY:+$CI_REGISTRY/}papers-web:${CI_COMMIT_SHORT_SHA:0:7} .
    deps:
      - build
    inputs:
      - 'apps/papers-web/Dockerfile'
      - 'apps/papers-web/package.json'
      - 'apps/papers-web/next.config.*'
      - 'apps/papers-web/public/**/*'
      - 'apps/papers-web/app/**/*'
      - 'apps/papers-web/components/**/*'
      - 'apps/papers-web/lib/**/*'
    options:
      runFromWorkspaceRoot: true
      runInCI: true
