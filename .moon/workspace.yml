# yaml-language-server: $schema=https://moonrepo.dev/schemas/workspace.json
# https://moonrepo.dev/docs/config/workspace
$schema: 'https://moonrepo.dev/schemas/workspace.json'

# REQUIRED: A map of all projects found within the workspace, or a list or file system globs.
projects:
  - 'apps/*'
  - 'packages/*'
  - 'proto'
vcs:
  manager: git
  provider: gitlab
  defaultBranch: master

# Include the vendored TypeScript toolchain WASM plugin in the Docker workspace
# skeleton, so that CI Docker builds do not need to download it from GitHub.
docker:
  scaffold:
    include:
      - '.moon/plugins/toolchains/*.wasm'
