# yaml-language-server: $schema=https://moonrepo.dev/schemas/tasks.json
$schema: 'https://moonrepo.dev/schemas/tasks.json'

implicitInputs:
  - package.json

fileGroups:
  app: []
  configs:
    - '*.{js,json,mjs,yml,yaml}'
  sources:
    - 'public/**/*'
    - 'src/**/*'
    - 'types/**/*'
    - 'lib/**/*'
    - 'app/**/*'
    - 'components/**/*'
  tests:
    - 'tests/**/*.test.*'
    - '**/__tests__/**/*'

tasks:
  format-check:
    command:
      - 'prettier'
      - '--check'
      - '.'
    inputs:
      - '.prettierrc'
      - '.prettierrc.json'
      - '@group(app)'
      - '@globs(sources)'
      - '@globs(configs)'
    local: true

  format:
    command:
      - 'prettier'
      - '--write'
      - '.'
    inputs:
      - '.prettierrc'
      - '.prettierrc.json'
      - '@group(app)'
      - '@globs(sources)'
      - '@globs(configs)'
    local: true

  lint:
    command: pnpm run lint
    inputs:
      - '@globs(sources)'
      - 'eslint.config.*'

  typecheck:
    command:
      - 'tsc'
      - '--noEmit'
    inputs:
      - '@group(app)'
      - '@globs(sources)'
      - 'tsconfig.json'

  test:
    command:
      - 'vitest'
      - 'run'
      - '--passWithNoTests'
    inputs:
      - '@group(app)'
      - '@globs(sources)'
      - '@globs(tests)'
      - 'vitest.config.*'
    options:
      outputStyle: 'buffer-only-failure'
