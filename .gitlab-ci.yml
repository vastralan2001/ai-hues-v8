workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  CI_REGISTRY: 'msai-cn-beijing.cr.volces.com/msai'

default:
  image: msai-cn-beijing.cr.volces.com/msai/devops/ci-base-node:v0.0.2
  tags:
    - kimi

stages:
  - test
  - build

lint:
  stage: test
  before_script:
    - pnpm install --frozen-lockfile
  script:
    - pnpm check
    - pnpm format:check

Build Image:
  stage: build
  script:
    - IMAGE=$CI_REGISTRY/aiushtha:${CI_COMMIT_SHORT_SHA:0:7}
    - echo "build $IMAGE"
    - docker build --push -t $IMAGE .
    - echo "Build and push $IMAGE successfully"
