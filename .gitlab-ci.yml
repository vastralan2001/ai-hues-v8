workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: node:20-bookworm
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile

stages:
  - verify
  - build

verify:
  stage: verify
  script:
    - pnpm check
    - pnpm format:check
    - pnpm build

build_artifact:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - .next/standalone/
      - .next/static/
      - public/
    expire_in: 7 days
